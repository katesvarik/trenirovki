<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Тренировки</title>
<style>
  html,body{margin:0; height:100%; background:#fff; color:#111;
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme: dark){ html,body{background:#0f0f10; color:#f2f2f3} }
  iframe{position:fixed; inset:0; width:100%; height:100%; border:0; display:block}
  #setup{max-width:480px; margin:0 auto; padding:40px 20px}
  #setup[hidden]{display:none}
  .logo{width:72px; height:72px; border-radius:18px; display:block; margin-bottom:18px}
  h1{font-size:26px; margin:0 0 8px}
  p{color:#8a8a8f; margin:0 0 18px}
  textarea{width:100%; box-sizing:border-box; min-height:96px; border:0; border-radius:14px; padding:12px;
    background:#f4f4f5; color:inherit; font:15px/1.35 ui-monospace,Menlo,monospace; resize:vertical; outline:none}
  @media (prefers-color-scheme: dark){ textarea{background:#1c1c1f} }
  button{margin-top:12px; width:100%; border:0; border-radius:14px; padding:14px; font:600 16px/1 inherit;
    background:#111; color:#fff}
  @media (prefers-color-scheme: dark){ button{background:#f2f2f3; color:#111} }
  .err{color:#d93636; font-size:14px; margin-top:10px; min-height:20px}
</style>
</head>
<body>
<div id="setup" hidden>
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>Тренировки</h1>
  <p>Вставь ссылку подключения из листа «Настройки» своей Google Таблицы (строка «Ссылка для подключения»).</p>
  <textarea id="link" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <button id="go">Подключить</button>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
  var STORE = 'trenirovki.link';
  // Only a Google Apps Script web app address with a key is accepted
  function clean(u){
    try{
      var url = new URL(String(u||'').trim());
      if(url.protocol !== 'https:' || url.hostname !== 'script.google.com') return null;
      if(!/^\/(a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)) return null;
      var k = url.searchParams.get('k'); if(!k || !/^[A-Za-z0-9]{16,64}$/.test(k)) return null;
      return url.origin + url.pathname + '?k=' + k;
    }catch(e){ return null; }
  }
  function save(l){ try{ localStorage.setItem(STORE, l); }catch(e){} }
  function load(){ try{ return localStorage.getItem(STORE) || ''; }catch(e){ return ''; } }

  var q = new URLSearchParams(location.search);
  if(q.has('reset')){ try{ localStorage.removeItem(STORE); }catch(e){} history.replaceState(null,'',location.pathname); q = new URLSearchParams(''); }
  var link = clean(q.get('app')) || clean(load());

  function start(l){
    save(l);
    // keep the address in the URL so "Add to Home Screen" remembers it
    var want = '?app=' + encodeURIComponent(l);
    if(location.search !== want) history.replaceState(null, '', location.pathname + want);
    document.getElementById('setup').hidden = true;
    var f = document.createElement('iframe');
    f.src = l; f.title = 'Дневник тренировок'; f.allow = 'autoplay';
    document.body.appendChild(f);
  }

  if(link){ start(link); return; }
  document.getElementById('setup').hidden = false;
  document.getElementById('go').addEventListener('click', function(){
    var l = clean(document.getElementById('link').value);
    if(!l){ document.getElementById('err').textContent = 'Это не похоже на ссылку подключения. Скопируй её целиком из листа «Настройки».'; return; }
    start(l);
  });
})();
</script>
</body>
</html>
